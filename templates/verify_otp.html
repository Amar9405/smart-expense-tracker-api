{% extends "base.html" %}

{% block title %}SpendIQ | Verify OTP{% endblock %}

{% block content %}

<div class="mx-auto max-w-md">

    <!-- Header -->

    <div class="mb-6 text-center">

        <div class="mx-auto flex h-12 w-12
                   items-center justify-center
                   rounded-xl
                   bg-indigo-500/10
                   text-xl">
            ✉️
        </div>

        <h1 class="mt-4 text-2xl font-bold text-slate-900">
            Verify Your Email
        </h1>

        <p class="mt-2 text-sm text-slate-500">
            Enter the 6-digit verification code
            sent to your email.
        </p>

    </div>


    <!-- OTP Card -->

    <div class="rounded-2xl
               border border-slate-200
               bg-white
               p-6
               shadow-sm">

        <form method="POST" action="{{ url_for('verify_otp') }}" class="space-y-5">

            <!-- OTP -->

            <div>

                <label for="otp" class="mb-2 block
                           text-sm font-medium
                           text-slate-700">
                    Verification Code
                </label>

                <input id="otp" type="text" name="otp" placeholder="Enter 6-digit code" inputmode="numeric"
                    maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required class="w-full rounded-xl
                           border border-slate-300
                           px-4 py-3
                           text-center
                           text-lg font-semibold
                           tracking-[0.4em]
                           text-slate-900
                           placeholder-slate-400
                           placeholder:tracking-normal
                           outline-none
                           transition
                           focus:border-indigo-500
                           focus:ring-2
                           focus:ring-indigo-100">

                <p class="mt-2 text-xs text-slate-500">
                    The verification code is valid for 10 minutes.
                </p>

            </div>


            <!-- Verify -->

            <button type="submit" class="w-full rounded-xl
                       bg-indigo-600
                       px-4 py-3
                       text-sm font-semibold
                       text-white
                       transition
                       hover:bg-indigo-700
                       focus:outline-none
                       focus:ring-2
                       focus:ring-indigo-500
                       focus:ring-offset-2">
                Verify Code
            </button>

        </form>


        <!-- Back -->

        <div class="mt-5
                   border-t border-slate-200
                   pt-5 text-center">

            <a href="{{ url_for('forgot_password') }}" class="text-sm font-semibold
                       text-indigo-600
                       hover:text-indigo-700">
                ← Request a New Code
            </a>

        </div>

    </div>

</div>

{% endblock %}
