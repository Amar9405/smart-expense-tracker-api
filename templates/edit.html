{% extends "base.html" %}

{% block title %}SpendIQ | Edit Expense{% endblock %}

{% block content %}

<!-- =========================================================
     PAGE HEADER
========================================================= -->

<div class="mb-8">

  <p class="text-sm font-medium text-indigo-400">
    Expense Management
  </p>

  <h1 class="mt-1 text-3xl font-bold tracking-tight text-white">
    Edit Expense
  </h1>

  <p class="mt-2 text-sm text-slate-400 sm:text-base">
    Update the details of your expense and save your changes.
  </p>

</div>


<!-- =========================================================
     EDIT EXPENSE CARD
========================================================= -->

<div class="max-w-2xl">

  <div class="rounded-2xl
               border border-slate-800
               bg-slate-800/70
               p-6
               shadow-lg
               sm:p-8">

    <!-- Card Header -->

    <div class="mb-7 flex items-center gap-4">

      <div class="flex h-12 w-12
                       items-center justify-center
                       rounded-xl
                       bg-indigo-500/10
                       text-lg font-bold
                       text-indigo-400">
        ₹
      </div>

      <div>

        <h2 class="text-lg font-semibold text-white">
          Update Transaction
        </h2>

        <p class="text-sm text-slate-500">
          Change the information below.
        </p>

      </div>

    </div>


    <!-- =================================================
             FORM
        ================================================== -->

    <form method="POST" action="{{ url_for('edit', expense_id=expense.id) }}" class="space-y-6">

      <!-- Description -->

      <div>

        <label for="description" class="mb-2 block text-sm font-medium text-slate-300">
          Description
        </label>

        <input id="description" type="text" name="description" value="{{ expense.description }}"
          placeholder="e.g. Groceries" required class="w-full rounded-xl
                           border border-slate-700
                           bg-slate-900
                           px-4 py-3
                           text-sm text-white
                           placeholder-slate-500
                           outline-none
                           transition
                           focus:border-indigo-500
                           focus:ring-2
                           focus:ring-indigo-500/20">

      </div>


      <!-- Amount + Date -->

      <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">

        <!-- Amount -->

        <div>

          <label for="amount" class="mb-2 block text-sm font-medium text-slate-300">
            Amount
          </label>

          <div class="relative">

            <span class="absolute left-4 top-1/2
                                   -translate-y-1/2
                                   text-sm font-medium
                                   text-slate-500">
              ₹
            </span>

            <input id="amount" type="number" step="0.01" min="0.01" name="amount"
              value="{{ '%.2f'|format(expense.amount) }}" placeholder="0.00" required class="w-full rounded-xl
                                   border border-slate-700
                                   bg-slate-900
                                   py-3 pl-9 pr-4
                                   text-sm text-white
                                   placeholder-slate-500
                                   outline-none
                                   transition
                                   focus:border-indigo-500
                                   focus:ring-2
                                   focus:ring-indigo-500/20">

          </div>

        </div>


        <!-- Date -->

        <div>

          <label for="date" class="mb-2 block text-sm font-medium text-slate-300">
            Date
          </label>

          <input id="date" type="date" name="date"
            value="{{ expense.date.strftime('%Y-%m-%d') if expense.date else today }}" required class="w-full rounded-xl
                               border border-slate-700
                               bg-slate-900
                               px-4 py-3
                               text-sm text-white
                               outline-none
                               transition
                               focus:border-indigo-500
                               focus:ring-2
                               focus:ring-indigo-500/20">

        </div>

      </div>


      <!-- Category -->

      <div>

        <label for="category" class="mb-2 block text-sm font-medium text-slate-300">
          Category
        </label>

        <select id="category" name="category" required class="w-full rounded-xl
                           border border-slate-700
                           bg-slate-900
                           px-4 py-3
                           text-sm text-white
                           outline-none
                           transition
                           focus:border-indigo-500
                           focus:ring-2
                           focus:ring-indigo-500/20">

          {% for c in categories %}

          <option value="{{ c }}" {% if expense.category==c %}selected{% endif %}>
            {{ c }}
          </option>

          {% endfor %}

        </select>

      </div>


      <!-- =================================================
                 ACTION BUTTONS
            ================================================== -->

      <div class="flex flex-col-reverse
                       gap-3
                       border-t border-slate-800
                       pt-6
                       sm:flex-row">

        <!-- Cancel -->

        <a href="{{ url_for('index') }}" class="flex-1 rounded-xl
                           border border-slate-700
                           bg-slate-900
                           px-5 py-3
                           text-center
                           text-sm font-semibold
                           text-slate-300
                           transition
                           hover:bg-slate-700
                           hover:text-white">
          Cancel
        </a>


        <!-- Save -->

        <button type="submit" class="flex-1 rounded-xl
                           bg-indigo-600
                           px-5 py-3
                           text-sm font-semibold
                           text-white
                           shadow-lg
                           transition
                           hover:bg-indigo-500
                           focus:outline-none
                           focus:ring-2
                           focus:ring-indigo-500
                           focus:ring-offset-2
                           focus:ring-offset-slate-900">
          Save Changes
        </button>

      </div>

    </form>

  </div>

</div>

{% endblock %}
