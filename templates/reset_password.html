{% extends "base.html" %}

{% block title %}SpendIQ | Reset Password{% endblock %}

{% block content %}

<div class="mx-auto max-w-md">

    <!-- Header -->

    <div class="mb-6 text-center">

        <div class="mx-auto flex h-12 w-12 items-center justify-center
                   rounded-xl bg-indigo-500/10 text-xl">
            🔐
        </div>

        <h1 class="mt-4 text-2xl font-bold text-slate-900">
            Create New Password
        </h1>

        <p class="mt-2 text-sm text-slate-500">
            Create a new password for your SpendIQ account.
        </p>

    </div>


    <!-- Reset Password Card -->

    <div class="rounded-2xl border border-slate-200
               bg-white p-6 shadow-sm">

        <form method="POST" action="{{ url_for('reset_password') }}" class="space-y-5">

            <!-- New Password -->

            <div>

                <label for="new_password" class="mb-2 block text-sm font-medium text-slate-700">
                    New Password
                </label>

                <input id="new_password" type="password" name="new_password" placeholder="Enter new password" required
                    minlength="8" autocomplete="new-password" class="w-full rounded-xl border border-slate-300
                           px-4 py-3 text-slate-900
                           placeholder-slate-400
                           outline-none transition
                           focus:border-indigo-500
                           focus:ring-2 focus:ring-indigo-100">

                <p class="mt-2 text-xs text-slate-500">
                    Password must be at least 8 characters.
                </p>

            </div>


            <!-- Confirm Password -->

            <div>

                <label for="confirm_password" class="mb-2 block text-sm font-medium text-slate-700">
                    Confirm New Password
                </label>

                <input id="confirm_password" type="password" name="confirm_password"
                    placeholder="Confirm your new password" required minlength="8" autocomplete="new-password" class="w-full rounded-xl border border-slate-300
                           px-4 py-3 text-slate-900
                           placeholder-slate-400
                           outline-none transition
                           focus:border-indigo-500
                           focus:ring-2 focus:ring-indigo-100">

            </div>


            <!-- Reset Button -->

            <button type="submit" class="w-full rounded-xl bg-indigo-600
                       px-4 py-3 text-sm font-semibold
                       text-white transition
                       hover:bg-indigo-700
                       focus:outline-none
                       focus:ring-2 focus:ring-indigo-500
                       focus:ring-offset-2">
                Reset Password
            </button>

        </form>

    </div>
</div>

{% endblock %}
