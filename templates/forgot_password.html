{% extends "base.html" %}

{% block title %}SpendIQ | Forgot Password{% endblock %}

{% block content %}

<div class="mx-auto max-w-md">

    <!-- Header -->
    <div class="mb-6 text-center">

        <div class="mx-auto flex h-12 w-12 items-center justify-center
                   rounded-xl bg-indigo-500/10 text-xl">
            🔐
        </div>

        <h1 class="mt-4 text-2xl font-bold text-slate-900">
            Forgot Password?
        </h1>

        <p class="mt-2 text-sm text-slate-500">
            Enter your registered email and we'll send you
            a verification code.
        </p>

    </div>


    <!-- Forgot Password Card -->
    <div class="rounded-2xl border border-slate-200
               bg-white p-6 shadow-sm">

        <form method="POST" action="{{ url_for('forgot_password') }}" class="space-y-5">

            <!-- Email -->
            <div>

                <label for="email" class="mb-2 block text-sm font-medium text-slate-700">
                    Email Address
                </label>

                <input id="email" type="email" name="email" placeholder="you@example.com" required autocomplete="email"
                    class="w-full rounded-xl border border-slate-300
                           px-4 py-3 text-slate-900
                           placeholder-slate-400
                           outline-none transition
                           focus:border-indigo-500
                           focus:ring-2 focus:ring-indigo-100">

            </div>


            <!-- Send OTP -->
            <button type="submit" class="w-full rounded-xl bg-indigo-600
                       px-4 py-3 text-sm font-semibold
                       text-white transition
                       hover:bg-indigo-700
                       focus:outline-none
                       focus:ring-2 focus:ring-indigo-500
                       focus:ring-offset-2">
                Send Verification Code
            </button>

        </form>


        <!-- Back to Login -->
        <div class="mt-5 border-t border-slate-200
                   pt-5 text-center">

            <a href="{{ url_for('login') }}" class="text-sm font-semibold
                       text-indigo-600
                       hover:text-indigo-700">
                ← Back to Login
            </a>

        </div>

    </div>

</div>

{% endblock %}
